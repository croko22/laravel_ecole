name: Deploy Laravel App to AWS EKS

# Disparador: Correr este workflow cada vez que haya un push a 'main' o manualmente
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ------ TRABAJO 1: Probar la aplicación (CI) ------
  test:
    name: Test Laravel App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, pdo, pdo_mysql, redis, gd, zip

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Copy .env file
        run: cp .env.example .env

      - name: Generate APP_KEY
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test

  # ------ TRABAJO 2: Desplegar la infraestructura (CD) ------
  deploy:
    name: Deploy to AWS EKS with Pulumi
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install Pulumi dependencies
        run: npm install
        working-directory: ./infra

      - name: Pulumi Up (Deploy Infrastructure)
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: dev
          work-dir: ./infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      - name: Get deployment URL
        working-directory: ./infra
        run: |
          echo "🌐 Application URL:"
          pulumi stack output frontendUrl
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
