apiVersion: v1
kind: Service
metadata:
  labels:
    app: laravel-app
  name: laravel-service
spec:
  type: LoadBalancer # Cambiado a LoadBalancer para obtener IP pública
  selector:
    app: laravel-app # Debe coincidir con el deployment
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80 # Puerto del contenedor Nginx
